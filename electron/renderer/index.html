<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>프롬프트 배틀</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="setup-screen">
      <h1>프롬프트 배틀</h1>
      <button id="pick-folder-btn">프로젝트 폴더 선택</button>
      <p id="folder-path"></p>
      <fieldset>
        <legend>테마</legend>
        <div id="theme-options"></div>
      </fieldset>
      <fieldset>
        <legend>난이도</legend>
        <label><input type="radio" name="difficulty" value="easy" /> 쉬움</label>
        <label><input type="radio" name="difficulty" value="normal" checked /> 보통</label>
        <label><input type="radio" name="difficulty" value="hard" /> 어려움</label>
      </fieldset>
      <button id="start-btn" disabled>던전 입장</button>
      <p id="setup-error" class="error-text" hidden></p>
    </section>

    <section id="dungeon-screen" hidden>
      <div id="monster-panel">
        <h2 id="monster-name"></h2>
        <pre id="monster-art"></pre>
        <div class="hp-bar-track"><div id="hp-bar-fill" class="hp-bar-fill"></div></div>
        <p id="hp-label"></p>
      </div>
      <p id="turn-status" class="turn-status" hidden></p>
      <div id="log"></div>
      <form id="attack-form">
        <input id="prompt-input" type="text" placeholder="공격 프롬프트를 입력하세요..." autocomplete="off" />
        <button type="submit">공격</button>
        <button type="button" id="flee-btn">도망</button>
      </form>
    </section>

    <section id="summary-screen" hidden>
      <h2>런 종료</h2>
      <p id="summary-text"></p>
      <button id="play-again-btn">다시 하기</button>
    </section>

    <div id="file-viewer-overlay" class="file-viewer-overlay" hidden>
      <div class="file-viewer-panel">
        <div class="file-viewer-header">
          <span id="file-viewer-title"></span>
          <button type="button" id="file-viewer-close">✕</button>
        </div>
        <div id="file-viewer-body" class="file-viewer-body"></div>
      </div>
    </div>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
