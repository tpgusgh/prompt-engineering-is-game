# Builds the app on Mac, Linux and Windows and checks it actually launches
# (bundled claude binary runs, start screen shows, no page errors).
name: Smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Smoke (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke.mjs
      - name: Smoke
        if: runner.os != 'Linux'
        run: node scripts/smoke.mjs
