# Builds the Windows installer on a real Windows machine (so the exe gets
# the app icon and version info — that step needs Windows tools) and
# attaches it to the GitHub release that `npm run release` just published.
name: Windows release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload (e.g. v0.16.0)
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --win --x64 --publish never
      - name: Upload installer to the release
        shell: bash
        run: gh release upload "$TAG" release/*-win-x64.exe --clobber
